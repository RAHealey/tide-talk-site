name: Keep scheduled workflows alive

# GitHub disables scheduled workflows in a public repo after 60 days with no
# commits, which would silently stop the ticker, YouTube live check and playoff
# page over the offseason. Re-enabling each workflow through the API resets
# that clock; running monthly keeps every workflow (this one included) well
# inside the window.
on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Re-enable every scheduled workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in $(grep -l '^  schedule:' .github/workflows/*.yml); do
            name=$(basename "$f")
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$name/enable" && echo "enabled $name"
          done
      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/report-run.mjs failure
      - name: Close failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/report-run.mjs success
