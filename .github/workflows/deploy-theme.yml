name: Deploy theme

# Manual: packages the theme as tide-talk.zip (Ghost names the theme after the
# zip filename) and uploads + activates it on the pod.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package theme
        run: zip -qr tide-talk.zip . -x '.git/*' '.github/*' 'tools/*' 'docs/*' 'out/*' '.cache/*' 'node_modules/*' '*.DS_Store' 'README.md' 'tide-talk.zip'
      - name: Validate with gscan
        run: npx -y gscan tide-talk.zip -z --fatal
      - name: Upload and activate
        env:
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
          GHOST_URL: https://casual-macaque.pikapod.net
        run: node tools/deploy-theme.mjs
