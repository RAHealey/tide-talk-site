name: Update playoff picture

# Rebuilds the RIFC playoff tracker from ESPN results and publishes it to the
# Ghost page /playoff-picture/. Runs every morning (6am ET) so results from the
# previous night are in, plus every 3h on match nights (Wed/Sat/Sun) so the page
# refreshes soon after full time. Writes to Ghost only when the picture changed.
on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 */3 * * 0,3,6'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and publish playoff picture
        env:
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
          GHOST_URL: https://casual-macaque.pikapod.net
        run: node tools/playoff/publish.mjs
